name: Set up DuckDB
description: Install the verified Linux x64 DuckDB CLI used to build Parquet files.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/duckdb-cli.zip"
        install_dir="$RUNNER_TEMP/duckdb-cli"
        curl --fail --show-error --location --connect-timeout 10 --max-time 60 \
          https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip \
          --output "$archive"
        echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $archive" | sha256sum --check --strict
        mkdir -p "$install_dir"
        unzip -o "$archive" -d "$install_dir"
        chmod +x "$install_dir/duckdb"
        echo "$install_dir" >> "$GITHUB_PATH"
        "$install_dir/duckdb" -c 'SELECT 1' > /dev/null
