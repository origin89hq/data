name: Deploy the spider
# Deliberately manual. A deploy arms a weekly cron that crawls three dozen shops and can spend
# money on a model, so it is a decision somebody makes rather than something a merge does.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: offgrid-equipment-production
    concurrency:
      group: offgrid-equipment-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter offgrid-equipment-worker test
      # The Worker serves the built site from its asset store, so there has to be one to serve.
      - run: pnpm --filter offgrid-equipment-site build
      # The secret goes up with the version rather than in a step of its own. The Worker's config
      # lists it as required, so a deploy without it is refused — which on a first deploy would
      # otherwise be circular, a secret needing a Worker that does not exist yet.
      - name: Deploy with its secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # GitHub reserves names that start with GITHUB_, so the Worker's secret is named here only.
          APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
        working-directory: apps/worker
        run: |
          if [ -z "$APP_CLIENT_SECRET" ]; then
            echo "GH_APP_CLIENT_SECRET is not set; nobody could sign in with GitHub" >&2
            exit 1
          fi
          umask 077
          printf 'GITHUB_CLIENT_SECRET=%s\n' "$APP_CLIENT_SECRET" > "$RUNNER_TEMP/secrets.env"
          trap 'rm -f "$RUNNER_TEMP/secrets.env"' EXIT
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.env"
      # The control token is for `just dev` only, and the Worker takes one only on a request
      # addressed to this machine. A secret stays on a Worker until it is deleted, so an older
      # deploy's is removed rather than left to be relied on.
      - name: Remove the control token from the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/worker
        run: |
          secrets=$(pnpm exec wrangler secret list --format json)
          if echo "$secrets" | jq -e 'any(.[]; .name == "CONTROL_TOKEN")' > /dev/null; then
            pnpm exec wrangler secret delete CONTROL_TOKEN
          fi
