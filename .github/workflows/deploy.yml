name: Deploy the spider
# Deliberately manual. A deploy arms a weekly cron that crawls three dozen shops and can spend
# money on a model, so it is a decision somebody makes rather than something a merge does.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: offgrid-equipment-production
    concurrency:
      group: offgrid-equipment-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter offgrid-equipment-worker test
      # The Worker serves the built site from its asset store, so there has to be one to serve.
      - run: pnpm --filter offgrid-equipment-site build
      # The token goes up with the version rather than in a step of its own. The Worker's config
      # lists CONTROL_TOKEN as required, so a deploy without it is refused — which on a first
      # deploy would otherwise be circular, the secret needing a Worker that does not exist yet.
      - name: Deploy with the control token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
        working-directory: apps/worker
        run: |
          if [ -z "$CONTROL_TOKEN" ]; then
            echo "CONTROL_TOKEN is not set in repository secrets; every control endpoint would refuse every request" >&2
            exit 1
          fi
          umask 077
          printf 'CONTROL_TOKEN=%s\n' "$CONTROL_TOKEN" > "$RUNNER_TEMP/secrets.env"
          trap 'rm -f "$RUNNER_TEMP/secrets.env"' EXIT
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.env"
