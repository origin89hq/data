name: Publish the dataset
# Unlike the deploy, this runs itself. A deploy arms a weekly cron that crawls three dozen shops
# and can spend money on a model, so somebody decides it. Publishing only copies tables that were
# already built from records already reviewed and merged, and a dataset nobody can fetch is not
# published at all.
#
# Once a day, not on every merge. A published version is loaded into D1 row by row, and D1 charges
# for each row and each index entry: a version is about 380,000 rows, near 1.25M writes, and as
# much again when it is retired. That is about $2.50 a version, and four merges that touched
# records in a day were four of them for one day's figures. A day's merges now go out together.
# `workflow_dispatch` publishes at once when something should not wait.
on:
  schedule:
    # Eleven hours after the daily pull opens its pull request, so a day's records go out the
    # evening they are merged.
    - cron: "0 23 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy the spider']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: offgrid-equipment-production
    # No Cloudflare credential. The job asks GitHub for a token naming this workflow, and the Worker
    # takes the dataset only from publish.yml on main in this environment.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: offgrid-equipment-dataset
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The build writes Parquet through the duckdb CLI, so it has to be here before anything
      # builds or tests. Left out of the first version of this file, which would have failed at
      # the first table.
      - uses: ./.github/actions/setup-duckdb
      # Nothing is published that the records themselves would not survive.
      - run: node src/validate.ts
      - run: node --test test/*.test.ts
      # Twice, and the second must match the first. A build that is not reproducible would publish
      # a hash in the manifest that the next build disagrees with.
      - name: Build the tables twice and compare
        run: |
          node src/build.ts
          sha256sum dist/* | sort > "$RUNNER_TEMP/build-1"
          node src/build.ts > /dev/null
          sha256sum dist/* | sort > "$RUNNER_TEMP/build-2"
          diff "$RUNNER_TEMP/build-1" "$RUNNER_TEMP/build-2"
      # Sends nothing when the front door serves this manifest and the store holds these files: a
      # deploy starts this again, and loading the same release twice writes every row twice.
      - name: Publish to data.origin89.com
        run: node tools/dataset/publish.ts
      - name: Check the front door serves what was just published
        run: |
          published=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).files['specs.parquet'].sha256)")
          served=$(curl -sf --max-time 60 "https://data.origin89.com/v1/specs.parquet" | sha256sum | cut -d' ' -f1)
          if [ "$published" != "$served" ]; then
            echo "data.origin89.com is serving $served, the build made $published" >&2
            exit 1
          fi
          echo "specs.parquet matches: $served"
