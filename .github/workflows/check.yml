name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The build writes Parquet through the duckdb CLI, and a build test runs in the unit suite,
      # so it has to be on PATH before anything runs rather than before the build step.
      - uses: ./.github/actions/setup-duckdb
      - run: just check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offgrid-equipment-${{ github.sha }}
          path: dist
          retention-days: 14
