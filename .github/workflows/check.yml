name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm --filter offgrid-equipment-scraper test
      # The scraper's types come from its wrangler config, so a binding that is declared in code
      # and missing from the config fails here rather than at deploy.
      - name: Type-check the scraper against its own bindings
        working-directory: scraper
        run: pnpm exec wrangler types && pnpm exec tsc --noEmit
      # Every record against its schema, then every reference between them.
      - run: pnpm validate
      # A build proves the records flatten, and two builds prove the artefacts are reproducible:
      # a Parquet writer is not deterministic by promise, so it is checked rather than assumed.
      - name: Build twice and compare
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends duckdb || curl -fsSL https://install.duckdb.org | sh
          export PATH="$HOME/.duckdb/cli/latest:$PATH"
          pnpm build > /dev/null
          sha256sum dist/* | sort > "$RUNNER_TEMP/first.txt"
          pnpm build > /dev/null
          sha256sum dist/* | sort > "$RUNNER_TEMP/second.txt"
          diff "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offgrid-equipment-${{ github.sha }}
          path: dist
          retention-days: 14
